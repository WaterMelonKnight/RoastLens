server:
  port: 8080

spring:
  application:
    name: roastlens
  datasource:
    url: ${ROASTLENS_DATASOURCE_URL:jdbc:h2:file:./data/roastlens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${ROASTLENS_DATASOURCE_USERNAME:sa}
    password: ${ROASTLENS_DATASOURCE_PASSWORD:}
    driver-class-name: ${ROASTLENS_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    root: INFO
    com.roastlens: DEBUG

roastlens:
  polling:
    enabled: ${ROASTLENS_POLLING_ENABLED:false}
    interval-ms: ${ROASTLENS_POLLING_INTERVAL_MS:3600000}
    initial-delay-ms: ${ROASTLENS_POLLING_INITIAL_DELAY_MS:60000}
    language: ${ROASTLENS_POLLING_LANGUAGE:zh-CN}
  content:
    default-language: ${ROASTLENS_DEFAULT_LANGUAGE:zh-CN}
  roastability:
    threshold: ${ROASTLENS_ROASTABILITY_THRESHOLD:0.6}
    max-batch-size: ${ROASTLENS_ROAST_MAX_BATCH_SIZE:20}
  finstream:
    base-url: ${ROASTLENS_FINSTREAM_BASE_URL:http://localhost:8081}
    timeout-seconds: ${ROASTLENS_FINSTREAM_TIMEOUT_SECONDS:5}
  llm:
    provider: ${ROASTLENS_LLM_PROVIDER:openai-compatible}
    base-url: ${ROASTLENS_LLM_BASE_URL:https://api.openai.com}
    api-key: ${ROASTLENS_LLM_API_KEY:}
    model: ${ROASTLENS_LLM_MODEL:gpt-4o-mini}
    temperature: ${ROASTLENS_LLM_TEMPERATURE:0.4}
    timeout-seconds: ${ROASTLENS_LLM_TIMEOUT_SECONDS:45}
    use-json-response-format: ${ROASTLENS_LLM_USE_JSON_RESPONSE_FORMAT:false}
