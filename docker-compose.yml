services:
  roastlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roastlens
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FINSTREAM_BASE_URL: ${FINSTREAM_BASE_URL:-http://host.docker.internal:8081}
      ROASTLENS_DATASOURCE_URL: jdbc:h2:file:/app/data/roastlens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
      ROASTLENS_POLLING_ENABLED: ${ROASTLENS_POLLING_ENABLED:-false}
    volumes:
      - roastlens-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  roastlens-data:
